# Perfil de demostracion: H2 en memoria, sin MySQL ni Node.
# Uso: java -jar target/mecanica-backend-1.0.0.jar --spring.profiles.active=demo

spring.datasource.url=jdbc:h2:mem:bd_mecanica;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Los archivos subidos en la demo se guardan aparte de los de desarrollo.
app.uploads-dir=uploads-demo
