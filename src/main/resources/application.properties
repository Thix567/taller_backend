server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Base de datos MySQL local (instancia de desarrollo en el puerto 3308)
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3308}/bd_mecanica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=utf8
spring.datasource.username=${DB_USER:taller_app}
spring.datasource.password=${DB_PASSWORD:taller123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=America/Lima

# Archivos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB
spring.servlet.multipart.enabled=true

# Configuracion propia del taller
app.uploads-dir=uploads
app.zona-horaria=America/Lima
app.dias-recordatorio=30
app.km-recordatorio=500
app.capacidad-default=3
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# JWT (solo demo academica: cambiar JWT_SECRET en produccion)
app.jwt.secret=${JWT_SECRET:taller-mecanico-demo-secret-key-2026-cambiar}
app.jwt.issuer=taller-mecanico-api
app.jwt.expiration-minutes=480

# Usuario inicial (solo se crea si la tabla usuarios esta vacia)
app.admin.username=${APP_ADMIN_USER:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logs
logging.level.com.taller.mecanica=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
